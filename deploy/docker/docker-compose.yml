# One-command deployment: copy .env.example to .env, append the two secrets with
# `docker run --rm ghcr.io/shhnote/shhnote init >> .env`, set DOMAIN and SHH_URL, then
# `docker compose up -d`. Caddy obtains the TLS certificate.
#
#   COMPOSE_PROFILES=caddy,postgres in .env     adds a Postgres container (set SHH_DB=postgres)
#   COMPOSE_PROFILES= (empty) in .env           no Caddy; see compose.own-proxy.yml

services:
  shhnote:
    # Pin the version you deploy (ghcr.io/shhnote/shhnote:0.3, say); `latest` moves.
    image: ghcr.io/shhnote/shhnote:latest
    build:
      context: ../..
    env_file: .env
    volumes:
      - shhnote-data:/data
    networks:
      - shhnote
    expose:
      - "3000"
    # The process needs no capabilities, must not gain any, and has a known footprint:
    # a few tokio threads and SHH_MAX_UPLOADS uploads of at most SHH_INLINE_MAX each.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    # Longer than the server's own 30 s drain, so an upload in progress can finish.
    stop_grace_period: 35s
    restart: unless-stopped

  caddy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - shhnote
    # Caddy needs to bind 80/443 and nothing else.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - shhnote
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${SHH_PG_DATABASE:-shhnote}
      POSTGRES_USER: ${SHH_PG_USERNAME:-shhnote}
      POSTGRES_PASSWORD: ${SHH_PG_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shhnote
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHH_PG_USERNAME:-shhnote} -d ${SHH_PG_DATABASE:-shhnote}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  shhnote:
    # A fixed subnet so SHH_TRUSTED_PROXIES in .env can name it.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  shhnote-data:
  caddy-data:
  caddy-config:
  postgres-data:
