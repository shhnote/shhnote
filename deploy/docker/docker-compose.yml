# One-command deployment: copy .env.example to .env, set DOMAIN, SHH_URL, SHH_SECRET_KEY
# and SHH_ADMIN_TOKEN, then `docker compose up -d`. Caddy obtains the TLS certificate.
#
#   docker compose --profile postgres up -d     adds a Postgres container (set SHH_DB=postgres)
#   COMPOSE_PROFILES= (empty) in .env           no Caddy; see compose.own-proxy.yml

services:
  shhnote:
    image: ghcr.io/zbcdo/shhnote:latest
    build:
      context: ../..
    env_file: .env
    volumes:
      - shhnote-data:/data
    networks:
      - shhnote
    expose:
      - "3000"
    read_only: true
    # Longer than the server's own 30 s drain, so an upload in progress can finish.
    stop_grace_period: 35s
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - shhnote
    depends_on:
      - shhnote
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${SHH_PG_DATABASE:-shhnote}
      POSTGRES_USER: ${SHH_PG_USERNAME:-shhnote}
      POSTGRES_PASSWORD: ${SHH_PG_PASSWORD:?set SHH_PG_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shhnote
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHH_PG_USERNAME:-shhnote} -d ${SHH_PG_DATABASE:-shhnote}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  shhnote:
    # A fixed subnet so SHH_TRUSTED_PROXIES in .env can name it.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  shhnote-data:
  caddy-data:
  caddy-config:
  postgres-data:
