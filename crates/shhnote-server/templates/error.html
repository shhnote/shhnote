{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="section section--error">
  <div class="container">
    <div class="vault stack">
      <div class="page-head">
        <p class="badge">{{ badge }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
      </div>
      <p class="btn-row"><a class="btn" href="{{ ctx.href("") }}">{{ ctx.t("error-home-link") }}</a></p>
    </div>
  </div>
</section>
{% endblock %}
