name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs. Actions are pinned to commits.
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    # The whole test suite, on both architectures, before anything is built for release.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Both architectures build natively. QEMU emulation of an arm64 rustc on an x86_64
  # runner is 15-30x slower (an hour-plus for this release profile), so each platform
  # runs on its own runner and keeps its own cache scope.
  binaries:
    needs: ci
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Package
        # Reproducible archive: fixed order, owner and timestamps (the tagged commit's),
        # gzip without a name or time, so the same inputs give the same bytes.
        run: |
          name="shhnote-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-musl"
          mkdir "$name"
          cp out/shhnote LICENSE README.md "$name/"
          epoch=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" \
              --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
              -cf - "$name" | gzip -n > "$name.tar.gz"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: shhnote-*.tar.gz*

  release:
    needs: binaries
    permissions:
      contents: write
      # Build provenance: a signed statement of which workflow built each archive.
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Checksums
        run: cat *.sha256 > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # GitHub stores attestations for public repositories only; skipped while private.
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            shhnote-*.tar.gz
            SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            shhnote-*.tar.gz
            SHA256SUMS
          generate_release_notes: true

  # One image per platform, built natively and pushed by digest only (no tag yet). The
  # cache scope matches the binaries job, so the compile is already done by the time
  # this runs.
  publish:
    # `@shhnote/client` on npm, through trusted publishing (OIDC, no token): the package on
    # npmjs.com is configured to trust this repository and workflow. The client is versioned
    # on its own, so a tag whose package version is already published publishes nothing.
    needs: ci
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          registry-url: https://registry.npmjs.org
      - name: Package
        run: scripts/pack-client.sh
      - name: Publish
        working-directory: client
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@shhnote/client@${version}" version >/dev/null 2>&1; then
            echo "@shhnote/client@${version} is already on npm; nothing to publish"
          else
            npm publish "../target/npm/shhnote-client-${version}.tgz" --provenance --access public
          fi

  image:
    needs: ci
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit's own provenance and SBOM add an unknown/unknown entry to the package
          # page; the attestation step is what vouches for the image.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          # The artifact store refuses a colon in a file name, so the "sha256:" prefix
          # is dropped here and put back by the manifest job.
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the two per-platform images into one multi-arch manifest, tag it, and attest
  # the merged digest, which is what `docker pull` resolves.
  manifest:
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        # Every tag is a full GitHub release and gets its exact image tag. `major.minor`
        # and `latest` move only on stable tags (no dash), so a pull of `latest` never
        # returns an rc, beta or alpha.
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=match,pattern=v(\d+\.\d+),group=1,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Create manifest
        id: manifest
        working-directory: digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:${DOCKER_METADATA_OUTPUT_VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # GitHub stores attestations for public repositories only; skipped while private.
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
