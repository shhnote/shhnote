# `cargo deny check`: what the dependency tree may contain (SPEC principle 11).

[graph]
all-features = false
# The release binaries are musl builds (Dockerfile); the gnu targets cover `cargo build`.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only; the project itself is AGPL-3.0-only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "AGPL-3.0-only",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# sqlx carries its own generation of base64, getrandom and the RustCrypto stack next to the
# ones the core uses; accepted rather than forced in step.
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates refer to each other by path alone; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
