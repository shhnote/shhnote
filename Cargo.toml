[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0-rc.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/shhnote/shhnote"
# Deployed as a binary and an image, never published to crates.io.
publish = false

[workspace.dependencies]
shhnote-core = { path = "crates/shhnote-core" }
shhnote-store = { path = "crates/shhnote-store" }

aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
# `sqlite-bundled` rather than `sqlite`: no extension loading, no deserialize API. sqlx brings
# its own generation of base64/getrandom/RustCrypto; the duplicates are accepted (deny.toml).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "any", "sqlite-bundled", "postgres", "migrate"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# No tracing, tower-log, matched-path or original-uri: diagnostics go through our own macros.
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "multipart", "query", "tokio"] }
dotenvy = { version = "0.15.7", default-features = false }
fluent-bundle = "0.16.0"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

# Argon2id module for the browser, built with `scripts/build-wasm.sh`.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
